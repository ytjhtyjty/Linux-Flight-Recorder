[package]
name = "linux-flight-recorder"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Offline, evidence-based Linux diagnostic snapshot comparison"
repository = "https://github.com/ytjhtyjty/Linux-Flight-Recorder"

[[bin]]
name = "lfr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
sha2 = "0.10"
libc = "0.2"
regex = "1"
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
strip = true
